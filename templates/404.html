{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="empty-state py-5">
  <i class="bi bi-signpost-2" style="font-size:4rem;"></i>
  <h2 class="fw-bold mt-3">404 - Page Not Found</h2>
  <p class="text-muted">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-2">
    <i class="bi bi-house-door me-1"></i>Back to Dashboard
  </a>
</div>
{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="text-center text-white">
    <i class="bi bi-signpost-2" style="font-size:4rem;"></i>
    <h2 class="fw-bold mt-3">404 - Page Not Found</h2>
    <a href="{{ url_for('main.login') }}" class="btn btn-light mt-3">Back to Login</a>
  </div>
</div>
{% endblock %}
